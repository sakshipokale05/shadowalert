<!DOCTYPE html>
<html>
<head>
    <title>Live Location Tracker</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>
        html,body{
            margin:0;
            height:100%;
        }

        #map{
            width:100%;
            height:100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const sbClient = window.supabase.createClient(
    "https://xrnbpwonwurpvjzrketa.supabase.co",
    "sb_publishable_6buYP7ae4rzMViMGgyKBbA_GRsHJQb8"
);

const map = L.map("map").setView([18.5204,73.8567],15);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19
    }
).addTo(map);

let marker = null;
const params = new URLSearchParams(window.location.search);
const userId = params.get("user");

console.log("Tracking User:", userId);
async function loadLocation() {

    console.log("Looking for user:", userId);

    const { data, error } = await sbClient
    .from("live_locations")
        .select("*")
        .eq("user_id", userId)
        .single();

    if (error) {
        console.error(error);
        return;
    }

    console.log(data);

    const lat = data.latitude;
    const lng = data.longitude;

    if (marker == null) {

        marker = L.marker([lat, lng]).addTo(map);

        map.setView([lat, lng], 16);

    } else {

        marker.setLatLng([lat, lng]);

    }

}

// Load location immediately
loadLocation();

// Refresh every 3 seconds
setInterval(loadLocation, 3000);

</script>

</body>
</html>
